apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ns-sablier

rules:
  - apiGroups:
      - apps
      - ""
    resources:
      - deployments
      - statefulsets
    verbs:
      - get # Retrieve info about specific dep
      - list # Events
      - watch # Events
  - apiGroups:
      - apps
      - ""
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs:
      - patch # Scale up and down
      - update # Scale up and down
      - get # Retrieve info about specific dep
      - list # Events
      - watch # Events
  # CloudNativePG は使っていないが、Sablier は group 一覧の取得で clusters を list し、
  # Forbidden だと一覧全体が失敗する。権限があれば CRD 不在の NotFound として読み飛ばされる。
  # TODO: Sablier 側で listClusters が Forbidden も読み飛ばすよう修正されたら、このルールを消す。
  # （CNPG の監視側は https://github.com/sablierapp/sablier/issues/1001 で修正済み）
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
