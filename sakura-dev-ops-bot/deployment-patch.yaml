kind: Deployment
apiVersion: apps/v1
metadata:
  name: dev-ops-bot

spec:
  template:
    spec:
      volumes:
        - name: secret
          secret:
            secretName: sakura-dev-ops-bot
            defaultMode: 0600

      containers:
        - name: dev-ops-bot
          image: ghcr.io/traptitech/sakura-dev-ops-bot:v0.2.0
          command:
            - /entrypoint.sh
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: TRAQ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sakura-dev-ops-bot
                  key: token
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: sakura-dev-ops-bot
                  key: github-pat
            - name: SERVERS_CONOHA_USERNAME
              $patch: delete
            - name: SERVERS_CONOHA_PASSWORD
              $patch: delete
            - name: SERVERS_CONOHA_TENANTID
              $patch: delete
            - name: SERVERS_SAKURA_BEARERTOKEN
              valueFrom:
                secretKeyRef:
                  name: vps-api
                  key: bearer-token
