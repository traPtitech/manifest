mode: dev-and-prod

repo:
  owner: traPtitech
  repo: traPortfolio-UI

webhook:
  name: portfolio-preview

tls:
  secretName: preview-portfolio-ui-tls

host:
  base: portfolio-preview.trapti.tech

preview:
  imagePattern: "ghcr.io/traptitech/traportfolio-ui:preview-{{number}}-{{head_sha}}"

backend:
  matcher: PathPrefix(`/api`)
  service:
    kind: Service
    namespace: 'portfolio{{ if eq . "dev" }}-dev{{ end }}'
    name: portfolio-backend
    port: 3009
    scheme: http
    weight: 1

staging:
  enabled: true
  # renovate:image-full
  image: "ghcr.io/traptitech/traportfolio-ui:main@sha256:b2cb5942b1daca36f344f68ce674fe3157c5eb5573fa99236f33ae465d1470dd"

otherParameters:
  port: 80
