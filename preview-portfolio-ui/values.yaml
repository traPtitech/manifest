mode: dev-and-prod

repo:
  owner: traPtitech
  repo: traPortfolio-UI

webhook:
  name: portfolio-preview

tls:
  secretName: preview-portfolio-ui-tls

host:
  base: portfolio-preview.trapti.tech

preview:
  imagePattern: "ghcr.io/traptitech/traportfolio-ui:preview-{{number}}-{{head_sha}}"

backend:
  matcher: PathPrefix(`/api`)
  service:
    kind: Service
    namespace: 'portfolio{{ if eq . "dev" }}-dev{{ end }}'
    name: portfolio-backend
    port: 3009
    scheme: http
    weight: 1

staging:
  enabled: true
  # renovate:image-full
  image: "ghcr.io/traptitech/traportfolio-ui:main@sha256:ac784030c1770a8d2c91d2abfb2549019de61064d67ce2d610bb81b8b750d2a4"

otherParameters:
  port: 80
