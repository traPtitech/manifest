name: Renovate

on:
  # For manual dispatch
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry-Run
        default: "false"
        required: false
      logLevel:
        description: Log-Level
        default: info
        required: false
      repoCache:
        description: "Reset or disable the cache?"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
  schedule:
    # 毎日3,9,21時(UTC)に実行
    # JSTでは6,12,18時
    - cron: "0 3,9,21 * * *"

permissions:
  packages: read

# Limit renovate from executing concurrently
concurrency:
  group: renovate
  cancel-in-progress: false

env:
  LOG_LEVEL: info
  RENOVATE_DRY_RUN: false
  RENOVATE_CONFIG_FILE: .github/renovate-bot.js
  cache_archive: renovate_cache.tar.gz
  cache_dir: /tmp/renovate/cache/renovate/repository
  cache_key: renovate-cache

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: "${{ secrets.RENOVATE_APP_ID }}"
          private-key: "${{ secrets.RENOVATE_APP_PRIVATE_KEY }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Override default config from dispatch variables
        shell: bash
        run: |
          echo "RENOVATE_DRY_RUN=${{ github.event.inputs.dryRun || env.RENOVATE_DRY_RUN }}" >> "${GITHUB_ENV}"
          echo "LOG_LEVEL=${{ github.event.inputs.logLevel || env.LOG_LEVEL }}" >> "${GITHUB_ENV}"

      - uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        if: github.event.inputs.repoCache != 'disabled' && github.event.inputs.repoCache != 'reset'
        continue-on-error: true
        with:
          name: ${{ env.cache_key }}
          path: cache-download
          if_no_artifact_found: "warn"

      - name: Extract renovate cache
        run: |
          if [ ! -f "cache-download/$cache_archive" ]; then
            echo "No cache found."
            exit 0
          fi

          mkdir -p "$cache_dir"
          tar -xzf "cache-download/$cache_archive" -C "$cache_dir"
          sudo chown -R 12021:0 /tmp/renovate/

      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          renovate-image: "ghcr.io/renovatebot/renovate"
          # renovate:general datasource=github-releases depName=renovatebot/renovate
          renovate-version: "44.224.2"
          configurationFile: "${{ env.RENOVATE_CONFIG_FILE }}"
          token: "${{ steps.generate-token.outputs.token }}"
        env:
          RENOVATE_GITHUB_PAT: "${{ secrets.GHCR_PAT }}"
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}

      - name: Compress renovate cache
        id: compress-cache
        if: github.event.inputs.repoCache != 'disabled'
        run: |
          if [ -d "$cache_dir" ]; then
            tar -czf "$cache_archive" -C "$cache_dir" .
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.compress-cache.outputs.created == 'true'
        with:
          name: ${{ env.cache_key }}
          path: ${{ env.cache_archive }}
          retention-days: 1
