name: Format

on:
  pull_request:

jobs:
  format:
    if: ${{ github.event.pull_request.user.login != 'trap-renovate[bot]' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node and Prettier with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # renovate:general datasource=github-releases depName=jdx/mise
          version: "v2026.11.0"
          install_args: node prettier

      - name: Check formatting
        run: prettier --check .
