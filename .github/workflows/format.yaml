name: Format

on:
  pull_request:

jobs:
  format:
    if: ${{ github.event.pull_request.user.login != 'trap-renovate[bot]' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node and Prettier with mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # renovate:general datasource=github-releases depName=jdx/mise
          version: "v2026.11.10"
          install_args: node prettier

      - name: Check formatting
        run: prettier --check .
