name: Validate

on:
  pull_request:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Cache CRDs
        id: crd
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .crd
          key: crd-${{ hashFiles('.mise/tasks/setup-crd.sh') }}
      - name: Prepare CRDs
        if: steps.crd.outputs.cache-hit != 'true'
        run: |
          uv sync --locked
          mise run setup-crd

      - name: Build and validate
        run: |
          for DIR in ./*/; do
            echo "Validating $DIR"
            mise run dry-run build "$DIR" | mise run check
          done
