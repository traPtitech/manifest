name: Validate Renovate Config

on:
  pull_request:
    paths:
      - ".github/renovate-bot.js"
      - ".github/renovate/**"
  workflow_dispatch:

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'trap-renovate[bot]' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Validate Renovate configs
        run: |
          mapfile -d '' configs < <(find .github/renovate -type f -name '*.json5' -print0)
          if [ -f .github/renovate-bot.js ]; then
            configs=(.github/renovate-bot.js "${configs[@]}")
          fi
          npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator "${configs[@]}"
        env:
          RENOVATE_GITHUB_PAT: placeholder
          # renovate:general datasource=github-releases depName=renovatebot/renovate
          RENOVATE_VERSION: "44.198.2"
