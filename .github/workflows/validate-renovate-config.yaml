name: Validate Renovate Config

on:
  pull_request:
    paths:
      - ".github/renovate-bot.js"
      - ".github/renovate.json5"
      - ".github/renovate/**"
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Renovate
        env:
          # renovate:general datasource=github-releases depName=renovatebot/renovate
          RENOVATE_VERSION: "44.198.0"
        run: npm install --no-save "renovate@$RENOVATE_VERSION"

      - name: Validate Renovate configuration
        run: |
          ./node_modules/.bin/renovate-config-validator .github/renovate-bot.js
          ./node_modules/.bin/renovate-config-validator --no-global .github/renovate.json5 .github/renovate/*.json5
        env:
          RENOVATE_GITHUB_PAT: placeholder
