name: Approve Renovate

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  status:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  approve:
    # Validate の成功時またはリリース待機の成功時に実行
    # `renovate/stability-days` の status イベントには Validate の結果がないので、ジョブ内で取得して確認する
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'renovate/')) ||
      (github.event_name == 'status' &&
       github.event.context == 'renovate/stability-days' &&
       github.event.state == 'success' &&
       github.event.sender.login == 'trap-renovate[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Approve eligible pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.sha }}
        run: |
          # minimumReleaseAge のステータスを確認し、 満たしていない場合は終了
          # minimumReleaseAge が無効なアップデートは通過
          stability=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/statuses?per_page=100" \
            --jq '[.[] | select(.context == "renovate/stability-days" and .creator.login == "trap-renovate[bot]")] | first | .state // "absent"')
          if [[ "$stability" != success && "$stability" != absent ]]; then
            echo "Release age check is $stability."
            exit 0
          fi

          # 同じコミットで Validate が成功していることを確認
          runs=$(gh api "repos/$GH_REPO/actions/workflows/validate.yaml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")
          # Renovate が作成し、自動マージを有効にした PR に絞って Approve
          gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls?per_page=100" | \
            jq -r --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" \
              '.[] | select(.state == "open" and .user.login == "trap-renovate[bot]" and
                .head.sha == $sha and .head.repo.full_name == $repo and
                (.head.ref | startswith("renovate/")) and
                .auto_merge.enabled_by.login == "trap-renovate[bot]") | [.number, .head.ref] | @tsv' | \
            while IFS=$'\t' read -r number branch; do
              if ! jq -e --arg branch "$branch" \
                '[.workflow_runs[] | select(.head_branch == $branch and .head_repository.full_name == env.GH_REPO)] | first | .conclusion == "success"' \
                <<< "$runs" >/dev/null; then
                continue
              fi
              gh api --method POST "repos/$GH_REPO/pulls/$number/reviews" \
                -f event=APPROVE -f commit_id="$HEAD_SHA"
            done
