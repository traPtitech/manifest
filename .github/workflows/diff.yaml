name: Diff

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "2"

      - name: Prepare ksops-dry-run
        run: .scripts/setup-ksops-dry-run.sh

      - name: Install dyff
        run: |
          set -o pipefail
          curl -fsL https://git.io/JYfAY | bash

      - name: Diff
        id: diff
        run: |
          set -o pipefail
          mapfile -t directories < <(
            { printf '%s\n' ./*/; git ls-tree -d --name-only HEAD^ | sed -n '/^[^.]/s|.*|./&/|p'; } | sort -u
          )
          TARGET=HEAD^ \
            DYFF_OPTIONS="--omit-header --output github" \
            .scripts/diff-to-old.sh "${directories[@]}" \
            | tee diff.txt

          DIFF=$(cat diff.txt)
          DIFF_LENGTH=${#DIFF}

          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          echo "diff_length=$DIFF_LENGTH" >> $GITHUB_OUTPUT

          echo '### Diff' >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          cat diff.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - if: ${{ steps.diff.outputs.diff != '' && steps.diff.outputs.diff_length > 50000 }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: "${{ github.event.pull_request.number }}"
          message-failure: Diff was not successful
          message: |
            ### Diff
            Diff was too long (> 50k chars) to include in PR comment.
            Please check actions summary for more info.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: ${{ steps.diff.outputs.diff != '' && steps.diff.outputs.diff_length <= 50000 }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: "${{ github.event.pull_request.number }}"
          message-failure: Diff was not successful
          message: |
            ### Diff
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
      - if: ${{ steps.diff.outputs.diff == '' }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: "${{ github.event.pull_request.number }}"
          message-failure: Diff was not successful
          message: |
            ### Diff
            No diff detected!
