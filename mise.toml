[tools]
age = "latest"
dyff = "latest"
helm = "latest"
ksops = "latest"
kubeconform = "latest"
kubectl = "latest"
kustomize = "latest"
node = "lts"
prettier = "latest"
sops = "latest"
uv = "latest"
yamllint = "latest"
yq = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
dir = "{{config_root}}"
description = "開発環境をセットアップ"
run = '''
  uv sync --locked
  mise run setup-crd
'''

[tasks.fmt]
dir = "{{cwd}}"
description = "Prettier でファイルをフォーマット"
usage = '''
  arg "<dir>" help="対象ディレクトリ" default="."
'''
run = '''
  prettier --write "${usage_dir?}"
'''

[tasks.lint]
dir = "{{cwd}}"
description = "yamllint でファイルを検査"
usage = '''
  arg "<dir>" help="対象ディレクトリ" default="."
'''
run = '''
  yamllint "${usage_dir?}"
'''
