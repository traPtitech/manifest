apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ghost
spec:
  entryPoints:
    - websecure
  tls:
    secretName: ghost-tls
  routes:
    - match: Host(`trap.jp`)
      services:
        - kind: Service
          name: ghost
          port: 80
          scheme: http
    - match: Host(`blog-admin.trap.jp`) && PathPrefix(`/ghost/api/content/`)
      priority: 100
      services:
        - kind: Service
          name: ghost
          port: 80
          scheme: http
    - match: Host(`blog-admin.trap.jp`)
      priority: 10
      middlewares:
        - name: auth-trap-jp-hard
          namespace: auth
      services:
        - kind: Service
          name: ghost
          port: 80
          scheme: http
