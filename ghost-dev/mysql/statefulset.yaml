apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost-mysql
spec:
  serviceName: ghost-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost-mysql
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: mysql
          image: mysql:26.10.0@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
          env:
            - name: MYSQL_DATABASE
              value: ghost_dev
            - name: MYSQL_USER
              value: ghost_dev
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /etc/mysql-secrets/root-password
            - name: MYSQL_PASSWORD_FILE
              value: /etc/mysql-secrets/password
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            tcpSocket:
              port: mysql
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: credentials
              mountPath: /etc/mysql-secrets
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: ghost-mysql-credentials
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
