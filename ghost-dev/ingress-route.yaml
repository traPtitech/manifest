apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ghost
spec:
  entryPoints:
    - websecure
  tls:
    secretName: ghost-tls
  routes:
    - match: Host(`blog-dev.trapti.tech`)
      services:
        - kind: Service
          name: ghost
          port: 80
          scheme: http
    - match: Host(`blog-admin-dev.trapti.tech`)
      middlewares:
        - name: auth-trapti-tech-hard
          namespace: auth
      services:
        - kind: Service
          name: ghost
          port: 80
          scheme: http
