apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-v2-dev

spec:
  entryPoints:
    - websecure
  tls:
    secretName: portal-v2-dev-tls
  routes:
    - kind: Rule
      middlewares:
        - name: auth-trapti-tech-hard
          namespace: auth
      match: Host(`portal-v2-dev.trapti.tech`) && !Path(`/.well-known/acme-challenge/{path:.*}`) && (PathPrefix(`/api/`) || PathPrefix(`/.well-known/`) || Path(`/activate`))
      priority: -99
      services:
        - namespace: portal-v2-dev
          kind: Service
          name: portal-v2-dev-backend
          port: 8101
          scheme: http
          weight: 1
    # forward auth のログインは /_oauth/ の下で受け取るので、middleware を通す
    # https://github.com/traPtitech/traefik-forward-auth#routing-the-callback-path
    - kind: Rule
      middlewares:
        - name: auth-trapti-tech-hard
          namespace: auth
      match: Host(`portal-v2-dev.trapti.tech`) && PathPrefix(`/_oauth/`)
      services:
        - namespace: portal-v2-dev
          kind: Service
          name: portal-v2-dev-backend
          port: 8101
          scheme: http
          weight: 1
