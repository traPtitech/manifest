apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - repo: https://valkey.io/valkey-helm/
    name: valkey
    version: 1.0.0
    namespace: nextcloud
    releaseName: valkey
    valuesFile: valkey-values.yaml

resources:
  - deployment.yaml
  - service.yaml
  - config.yaml
  - nginx-config.yaml
  - certificate.yaml
  - ingress-route.yaml
  - valkey-network-policy.yaml

generators:
  - ksops.yaml
