apiVersion: apps/v1
kind: Deployment
metadata:
  name: traq-frontend
spec:
  template:
    spec:
      nodeSelector: null
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - eee101.tokyotech.org
              weight: 1
      initContainers:
        - name: convert-config
          args:
            - |
              {
                printf ';(() => { self.traQConfig = '
                cat /config-in/config.jsonc
                printf '; self.traQConfig.name = "traQ Insider";'
                # backend が停止しているときでもフロントエンドが認識するオリジンが
                # q.trapti.tech にフォールバックしないように本番のオリジンを明示
                printf ' self.traQConfig.backendOrigin = "https://q.trap.jp"; })()'
              } > /app/override/config.js
      containers:
        - name: traq-frontend
          image: ghcr.io/traptitech/traq-ui:master@sha256:c0e1b4422150d52484bc0d9916bfb72666362dd46d49284694881648bdf077ca
          command: ["sh", "-ec"]
          args:
            - |
              cat >> /app/default/defaultTheme.js <<EOF
              ;for (const theme of [window.defaultLightTheme, window.defaultDarkTheme]) {
                theme.browser = { ...theme.browser, themeColor: "$THEME_COLOR" };
              }
              EOF

              sed -i -E "s/(\"theme_color\"[[:space:]]*:[[:space:]]*)\"[^\"]*\"/\1\"$THEME_COLOR\"/" \
                /app/default/manifest.webmanifest

              rm -f /usr/share/caddy/defaultTheme.js.br /usr/share/caddy/defaultTheme.js.gz \
                /usr/share/caddy/manifest.webmanifest.br /usr/share/caddy/manifest.webmanifest.gz

              exec /startup.sh
          env:
            - name: APP_NAME
              value: traQ Insider
            - name: THEME_COLOR
              value: "#ff7f27"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "40m"
              memory: "128Mi"
