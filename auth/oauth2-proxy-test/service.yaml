apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-test
spec:
  selector:
    app: oauth2-proxy-test
  ports:
    - name: hard
      port: 4180
      targetPort: hard
    - name: soft
      port: 4181
      targetPort: soft
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-test-whoami
spec:
  selector:
    app: oauth2-proxy-test-whoami
  ports:
    - name: http
      port: 80
      targetPort: http
