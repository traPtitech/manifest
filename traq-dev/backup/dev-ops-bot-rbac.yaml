apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-ops-bot-backup
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-ops-bot-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-ops-bot-backup
subjects:
  - kind: ServiceAccount
    name: dev-ops-bot
    namespace: dev-ops-bot
