apiVersion: apps/v1
kind: Deployment
metadata:
  name: traq-frontend
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: eee101.tokyotech.org
      containers:
        - name: traq-frontend
          env: null
          image: ghcr.io/traptitech/traq-ui:master@sha256:56edd046af9eee39a595a9e3b02ddc2d6d3fb7d694fc3c02d52e6ab313f964ab
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "40m"
              memory: "128Mi"
