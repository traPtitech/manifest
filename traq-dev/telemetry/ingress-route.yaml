apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traq-telemetry
spec:
  entryPoints:
    - websecure
  tls:
    secretName: traq-tls
  routes:
    - kind: Rule
      match: Host(`q-dev.trapti.tech`) && Path(`/telemetry/collect`) && Method(`POST`) && Header(`X-Traq-Telemetry`, `1`)
      middlewares:
        - name: traq-telemetry-rate-limit
        - name: traq-telemetry-buffering
        - name: auth-trapti-tech-hard
          namespace: auth
        - name: traq-telemetry-auth
        - name: traq-telemetry-strip-credentials
        - name: traq-telemetry-path
      services:
        - namespace: alloy
          kind: Service
          name: alloy
          port: 12347
