apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traq-backend

spec:
  routes:
    - kind: Rule
      match: >-
        Host(`q-dev.trapti.tech`) &&
        Method(`POST`) && PathRegexp(`^/api/v3/users/?$`)
      priority: 100
      middlewares:
        - name: auth-trapti-tech-hard
          namespace: auth
      services:
        - namespace: traq-dev
          kind: Service
          name: traq-backend
          port: 8001
          scheme: http
          weight: 1
    - kind: Rule
      match: Host(`q-dev.trapti.tech`) && (PathPrefix(`/api/`) || PathPrefix(`/.well-known/`))
      priority: 10
      services:
        - namespace: traq-dev
          kind: Service
          name: traq-backend
          port: 8001
          scheme: http
          weight: 1
